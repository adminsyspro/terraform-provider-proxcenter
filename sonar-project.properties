sonar.projectKey=adminsyspro_terraform-provider-proxcenter
sonar.organization=adminsyspro
sonar.projectName=terraform-provider-proxcenter

sonar.sources=.
sonar.exclusions=**/*_test.go,docs/**,examples/**,templates/**,dist/**,internal/client/testdata/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Go coverage produced by the workflow with `go test -coverprofile`.
sonar.go.coverage.reportPaths=coverage.out
# main.go only wires the provider server: nothing to test there.
sonar.coverage.exclusions=main.go
