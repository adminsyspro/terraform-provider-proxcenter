name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# GitHub-owned actions only, pinned by SHA; third-party tools are downloaded
# in a run step and checked against their SHA-256.
jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -v ./...
      - name: Install golangci-lint
        env:
          GOLANGCI_VERSION: 2.15.0
          GOLANGCI_SHA256: 9b7fe6a6bf6334b98decf8d86b11415ea7889afdabdd1959fdce23af2a9ebcea
        run: |
          curl -fsSL -o "$RUNNER_TEMP/golangci.tar.gz" \
            "https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_VERSION}/golangci-lint-${GOLANGCI_VERSION}-linux-amd64.tar.gz"
          echo "${GOLANGCI_SHA256}  $RUNNER_TEMP/golangci.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/golangci.tar.gz" -C "$RUNNER_TEMP" --strip-components=1 "golangci-lint-${GOLANGCI_VERSION}-linux-amd64/golangci-lint"
      - run: '"$RUNNER_TEMP/golangci-lint" run'

  docs:
    name: Generated docs are committed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Terraform
        env:
          TF_VERSION: 1.17.2
          TF_SHA256: e6f16b2f0b137ee5729caa8c4e79a3bae4ee261acd198a1fcfa8584a6296605b
        run: |
          curl -fsSL -o "$RUNNER_TEMP/terraform.zip" "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
          echo "${TF_SHA256}  $RUNNER_TEMP/terraform.zip" | sha256sum -c -
          unzip -q -o "$RUNNER_TEMP/terraform.zip" -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: |
          go tool tfplugindocs generate --provider-name proxcenter
          git diff --exit-code -- docs

  test:
    name: Unit tests (Terraform ${{ matrix.terraform.version }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 1.11 is the oldest release with write-only attributes.
        terraform:
          - version: 1.11.4
            sha256: 1ce994251c00281d6845f0f268637ba50c0005657eb3cf096b92f753b42ef4dc
          - version: 1.17.2
            sha256: e6f16b2f0b137ee5729caa8c4e79a3bae4ee261acd198a1fcfa8584a6296605b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Terraform
        env:
          TF_VERSION: ${{ matrix.terraform.version }}
          TF_SHA256: ${{ matrix.terraform.sha256 }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/terraform.zip" "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
          echo "${TF_SHA256}  $RUNNER_TEMP/terraform.zip" | sha256sum -c -
          unzip -q -o "$RUNNER_TEMP/terraform.zip" -d "$RUNNER_TEMP/bin"
          echo "TF_ACC_TERRAFORM_PATH=$RUNNER_TEMP/bin/terraform" >> "$GITHUB_ENV"
      - run: go test -race -cover ./...
